version: "3"

vars:
  HOST:
    sh: hostname -s
  FLAKE: "{{.ROOT_DIR}}"
  PLATFORM:
    sh: uname -s
  TOPLEVEL:
    sh: |
      case "{{.PLATFORM}}" in
        Darwin) printf '%s#darwinConfigurations."%s".system\n' "{{.FLAKE}}" "{{.HOST}}" ;;
        Linux) printf '%s#nixosConfigurations."%s".config.system.build.toplevel\n' "{{.FLAKE}}" "{{.HOST}}" ;;
        *) printf 'unsupported platform: %s\n' "{{.PLATFORM}}" >&2; exit 1 ;;
      esac
  # nix-desktop dev loop: when a local checkout of the shared desktop flake
  # exists (./nix-desktop, ../nix-desktop, or $NIX_DESKTOP_DIR), build against it
  # instead of the pinned GitHub revision — edit there, `task switch` here,
  # push when happy, then `task update-desktop` to re-pin.
  DESKTOP_DIR:
    sh: |
      for d in "${NIX_DESKTOP_DIR:-}" "{{.ROOT_DIR}}/nix-desktop" "{{.ROOT_DIR}}/../nix-desktop"; do
        if [ -n "$d" ] && [ -e "$d/flake.nix" ]; then printf '%s' "$d"; break; fi
      done
      true
  # NB: the value starts with "--"; pass it as a %s ARGUMENT — Task's built-in
  # shell does not honour `printf --` as an option terminator (it printed "--").
  DESKTOP_OVERRIDE:
    sh: '[ -n "{{.DESKTOP_DIR}}" ] && printf "%s" "--override-input nix-desktop path:{{.DESKTOP_DIR}}" || true'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  info:
    desc: Show the selected host, flake and nix-desktop source
    cmds:
      - 'echo "Host:  {{.HOST}}"'
      - 'echo "Flake: {{.FLAKE}}"'
      - '[ -n "{{.DESKTOP_DIR}}" ] && echo "nix-desktop: LOCAL {{.DESKTOP_DIR}} (override active)" || echo "nix-desktop: pinned revision from flake.lock"'
    silent: true

  fmt:
    desc: Format Nix, shell, YAML, JSON, and Markdown files
    cmds:
      - nix fmt "{{.FLAKE}}"

  check:
    desc: Run flake checks with nix-output-monitor
    preconditions:
      - sh: command -v nom >/dev/null 2>&1
        msg: Run this task through `nix run .#task -- check` or from `nix develop`.
    cmds:
      - |
        bash -o pipefail -c '
          flake="$1"
          shift
          nix flake check "$flake" \
            --show-trace \
            --log-format internal-json \
            -v \
            "$@" 2>&1 | nom --json
        ' -- "{{.FLAKE}}" {{.DESKTOP_OVERRIDE}} {{.CLI_ARGS}}

  build:
    desc: Build the selected system configuration without activating it
    aliases: [b]
    preconditions:
      - sh: command -v nom >/dev/null 2>&1
        msg: Run this task through `nix run .#task -- build` or from `nix develop`.
    cmds:
      - >-
        nom build
        '{{.TOPLEVEL}}'
        --no-link
        --show-trace
        {{.DESKTOP_OVERRIDE}}
        {{.CLI_ARGS}}

  test:
    desc: Build and activate temporarily; the change is lost after reboot
    aliases: [t]
    cmds:
      - task: _rebuild
        vars:
          ACTION: test

  boot:
    desc: Build and make the configuration the next boot target
    cmds:
      - task: _rebuild
        vars:
          ACTION: boot

  switch:
    desc: Build and activate the selected system configuration
    aliases: [s]
    cmds:
      - task: _rebuild
        vars:
          ACTION: switch

  update:
    desc: Update all flake inputs, or inputs named after `--`
    aliases: [u]
    cmds:
      - nix flake update {{.CLI_ARGS}}

  update-desktop:
    desc: Pin the shared desktop layer (nix-desktop) to its latest pushed revision
    cmds:
      - nix flake update nix-desktop

  upgrade:
    desc: Update all inputs and switch to the resulting configuration
    cmds:
      - task: update
      - task: switch

  clean:
    desc: Delete system generations and store paths older than AGE (default 3d)
    vars:
      AGE: '{{default "3d" .AGE}}'
    cmds:
      - sudo nix-collect-garbage --delete-older-than "{{.AGE}}"

  _rebuild:
    internal: true
    requires:
      vars:
        - name: ACTION
          enum: [test, boot, switch]
    preconditions:
      - sh: command -v nom >/dev/null 2>&1
        msg: Run this task through `nix run .#task -- {{.ACTION}}` or from `nix develop`.
    cmds:
      - |
        bash -o pipefail -c '
          action="$1"
          flake="$2"
          platform="$3"
          shift 3

          # Authenticate before stdout/stderr are piped through nom so the
          # password prompt remains visible. -n prevents a hidden second prompt.
          sudo -v

          case "$platform" in
            Darwin)
              if [ "$action" = boot ]; then
                printf "The boot action is only supported on NixOS.\n" >&2
                exit 1
              fi

              sudo -n -H nix run nix-darwin -- "$action" \
                --flake "$flake" \
                --show-trace \
                "$@" 2>&1 | nom
              ;;
            Linux)
              sudo -n -H nixos-rebuild "$action" \
                --flake "$flake" \
                --show-trace \
                "$@" 2>&1 | nom
              ;;
            *)
              printf "Unsupported platform: %s\n" "$platform" >&2
              exit 1
              ;;
          esac
        ' -- "{{.ACTION}}" "{{.FLAKE}}#{{.HOST}}" "{{.PLATFORM}}" {{.DESKTOP_OVERRIDE}} {{.CLI_ARGS}}
